# This file does not run until it is on the default branch.
# GitHub does not replay a missed or dropped hour. The next successful wake
# runs one due queue step; it does not catch up every missed hour at once.
# In a public repository GitHub disables this schedule after 60 days without
# repository activity. Minute 17 avoids the crowded top of the hour.
# Keep the Actions spending limit at $0.
name: growth-tick

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run one growth step
        env:
          DASHBOARD_URL: https://meta-dashboard-9n92.onrender.com
          GROWTH_TICK_SECRET: ${{ secrets.GROWTH_TICK_SECRET }}
        run: python scripts/wake_dashboard.py
